name: Build

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  Configuration: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACT:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest]
        # os: [windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Set path for nektos/act
        if: ${{ runner.os == 'Windows' && env.ACT }}
        run: echo "C:\Program Files\Git\bin" >> $GITHUB_PATH
        shell: '"C:\Program Files\Git\bin\bash.exe" -c {0}'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: "Determine prerequisites"
        id: prerequisite
        run: |
          echo "need_node=$(command -v node >/dev/null 2>&1 && echo 0 || echo 1)" >> $GITHUB_OUTPUT
          echo "has_git_repo=$(git rev-parse --git-dir > /dev/null 2>&1 && echo 1 || echo 0)" >> $GITHUB_OUTPUT

      # Switch to https://github.com/actions/setup-node when it works
      - name: Install node
        if: ${{ steps.prerequisite.outputs.need_node == '1' }}
        run: |
          if [ "${{ runner.os }}" = "windows" ]
          then
            choco install nodejs -y
            echo "C:\Program Files\nodejs" >> $GITHUB_PATH
          else
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash - &&\
            apt-get install -y nodejs
          fi

      - name: Setup .NET
        if: ${{ runner.os != 'Windows' || !env.ACT }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - uses: dotnet/nbgv@master
        id: nbgv
        if: ${{ steps.prerequisite.outputs.has_git_repo == '1' }}
        with:
          setAllVars: true

      # Reads the version to install from the packageManager field of package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        if: ${{ !env.ACT }}

      - run: pnpm install --frozen-lockfile

      - name: "Run pre-commit hooks"
        run: bash $GITHUB_WORKSPACE/.husky/pre-commit normal

      # https://github.com/actions/cache/blob/main/examples.md
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          # Versions live in Directory.Packages.props, and which packages each project
          # asks for lives in the project files. There are no lock files to hash.
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore dependencies
        run: dotnet restore /property:Configuration=Release
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --settings tests/coverlet.runsettings
      - name: Generate code coverage report
        run: dotnet dnx --yes dotnet-reportgenerator-globaltool -reports:**/coverage.cobertura.xml -targetdir:./reports/coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ env.CODECOV_TOKEN != '' }}
      - name: Upload artifacts (code coverage)
        uses: actions/upload-artifact@v5
        with:
          name: coverage_${{ matrix.os }}
          path: reports/coverage
        if: steps.codecov.outcome == 'success'
      - name: Build Roslyn variants
        if: ${{ runner.os != 'Windows' }}
        run: |
          gen="src/Zomp.SyncMethodGenerator/Zomp.SyncMethodGenerator.csproj"
          for rv in roslyn4.8 roslyn4.12 roslyn5.0; do
            dotnet build "$gen" -c Release -p:RoslynVersion=$rv -p:BaseIntermediateOutputPath=obj/$rv/ -p:OutputPath=bin/$rv/Release/
          done
      - name: Pack
        if: ${{ runner.os != 'Windows' }}
        run: dotnet pack src/Zomp.SyncMethodGenerator.Pack/Zomp.SyncMethodGenerator.Pack.csproj --configuration Release -o packages --no-build
      - name: Upload artifacts (.nupkg)
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: packages/

  sign:
    needs: build
    # Skip for outside contributors: fork PRs have no access to signing/publish
    # secrets, so the release pipeline can't do anything useful for them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Set path for nektos/act
        if: ${{ runner.os == 'Windows' && env.ACT }}
        run: echo "C:\Program Files\Git\bin" >> $GITHUB_PATH
        shell: '"C:\Program Files\Git\bin\bash.exe" -c {0}'

      - name: "Determine prerequisites"
        id: prerequisite
        run: |
          echo "need_node=$(command -v node >/dev/null 2>&1 && echo 0 || echo 1)" >> $GITHUB_OUTPUT

      - name: Setup .NET
        if: ${{ runner.os != 'Windows' || !env.ACT }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Install node
        if: ${{ steps.prerequisite.outputs.need_node == '1' }}
        run: |
          if [ "${{ runner.os }}" = "windows" ]
          then
            choco install nodejs -y
            echo "C:\Program Files\nodejs" >> $GITHUB_PATH
          else
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash - &&\
            apt-get install -y nodejs
          fi

      - name: Download Package artifact
        uses: actions/download-artifact@v5
        with:
          name: packages
          path: packages

      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNER_CLIENT_ID }}
        if: ${{ env.AZURE_CLIENT_SECRET != '' && github.ref == 'refs/heads/master' }}
        run: |
          dotnet dnx --prerelease --yes sign code trusted-signing \
          --base-directory "${{ github.workspace }}/packages" \
          "*.nupkg" \
          --trusted-signing-endpoint "${{ secrets.TRUSTED_SIGNING_ENDPOINT }}" \
          --trusted-signing-account "${{ secrets.TRUSTED_SIGNING_ACCOUNT }}" \
          --trusted-signing-certificate-profile "${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}" \
          -v normal

      # Catches a signing step which quietly produced nothing usable, while the package can
      # still be thrown away. Runs here rather than after publishing because Windows is where
      # signature verification needs no extra setup.
      - name: Verify signature
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
        if: ${{ env.AZURE_CLIENT_SECRET != '' && github.ref == 'refs/heads/master' }}
        run: dotnet nuget verify "${{ github.workspace }}/packages/"*.nupkg --all

      - name: Upload artifacts (.nupkg)
        uses: actions/upload-artifact@v5
        with:
          name: packages-signed
          path: packages/

  publish:
    needs: sign
    # Skip for outside contributors: fork PRs have no access to signing/publish
    # secrets, so the release pipeline can't do anything useful for them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag and GitHub Release

    steps:
      - name: Set path for nektos/act
        if: ${{ runner.os == 'Windows' && env.ACT }}
        run: echo "C:\Program Files\Git\bin" >> $GITHUB_PATH
        shell: '"C:\Program Files\Git\bin\bash.exe" -c {0}'

      - name: Setup .NET
        if: ${{ runner.os != 'Windows' || !env.ACT }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Download Package artifact
        uses: actions/download-artifact@v5
        with:
          name: packages-signed

      - name: Push to MyGet
        env:
          MYGET_PUSH_KEY: ${{ secrets.MYGET_PUSH_KEY }}
        if: ${{ env.MYGET_PUSH_KEY != '' }}
        run: dotnet nuget push *.nupkg -s https://www.myget.org/F/zomp-sync-method-generator/api/v3/index.json -k ${{ secrets.MYGET_PUSH_KEY }}

      - name: Push to NuGet
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_PUSH_KEY }}

      # Prepared but not announced. NuGet has accepted the upload at this point and nothing
      # more; it still validates the signature and scans the package, and a package whose
      # certificate is not registered with the account is rejected at that stage. Announcing a
      # version which turns out to be uninstallable is worse than announcing it a few minutes
      # later, and building the release now means a slow validation costs a single command
      # rather than reconstructing the notes and assets by hand.
      - name: Draft GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh infers the repo from this when no checkout is present
        run: |
          pkg=$(ls Zomp.SyncMethodGenerator.*.nupkg | head -1)
          version=${pkg#Zomp.SyncMethodGenerator.}
          version=${version%.nupkg}
          gh release create "v$version" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes \
            ./*.nupkg

      - name: Wait for NuGet to finish validating
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: |
          pkg=$(ls Zomp.SyncMethodGenerator.*.nupkg | head -1)
          version=${pkg#Zomp.SyncMethodGenerator.}
          version=${version%.nupkg}
          index=https://api.nuget.org/v3-flatcontainer/zomp.syncmethodgenerator/index.json

          for _ in $(seq 1 40); do
            if curl -s "$index" | grep -q "\"$version\""; then
              echo "$version is available on NuGet"
              exit 0
            fi

            sleep 30
          done

          echo "::error::$version was accepted by NuGet but has not become available within 20 minutes. The release is drafted and can be published once it appears. See https://www.nuget.org/packages/Zomp.SyncMethodGenerator/$version"
          exit 1

      # The package is installable, so the release can be announced. This is also what creates
      # the tag, which a draft release holds but does not push.
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pkg=$(ls Zomp.SyncMethodGenerator.*.nupkg | head -1)
          version=${pkg#Zomp.SyncMethodGenerator.}
          version=${version%.nupkg}
          gh release edit "v$version" --draft=false
